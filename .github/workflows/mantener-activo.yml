name: Mantener activo Supabase

# El plan gratis de Supabase pausa los proyectos con poca actividad y, mientras está pausado,
# no andan las cuentas, los amigos, el workshop ni las estadísticas. Una lectura cada 3 días
# no alcanzó (se pausó igual), así que esta tarea corre todos los días: inicia sesión con la
# cuenta de demostración y lee varias tablas, como lo haría un usuario real.
# Usa la clave publishable (pública por diseño) y la cuenta demo, cuyas credenciales son
# públicas (son de prueba). Si el proyecto ya está pausado, la tarea falla y GitHub avisa
# por email: hay que restaurarlo desde el panel de Supabase.

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

jobs:
  consulta:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://pyamkqingktpeexkgryb.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_XowZg_fp4JzC3aaUEbQqyQ_scBwh4y8
    steps:
      - name: Inicio de sesión y lecturas como un usuario
        run: |
          token=$(curl -sf -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' \
            -d '{"email":"jugador@amonglies.test","password":"AmongLies2026"}' | jq -r .access_token)
          test -n "$token" && test "$token" != null
          for table in profiles player_stats friendships workshop_items; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $token" \
              "$SUPABASE_URL/rest/v1/$table?select=*&limit=5")
            echo "$table: $status"
            test "$status" = 200
          done

      - name: Despertar el servidor de juego
        run: curl -s --max-time 120 https://amonglies-server.onrender.com/health || true
