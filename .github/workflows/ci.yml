name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AmongLies
    env:
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AmongLies/package-lock.json

      - run: npm ci

      - name: Escaneo de secretos
        run: npm run check-secrets

      - name: Lint + formato
        run: npm run lint

      - name: Type check y build (shared, server, web)
        run: npm run build

      - name: Tests unitarios + cobertura de ramas mínima
        run: npm run test:cov --workspace @amonglies/server

      # Sólo dependencias de producción: las vulnerabilidades que quedan en
      # herramientas de desarrollo (linter) no tienen arreglo publicado.
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high
